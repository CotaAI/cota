policies:
  - name: pet-selection
    steps:
      - user: 帮我安排宠物的日常照护
      - bot:
          - thought: 先明确日常照护需求，使用 pet-care，根据真实用户信息决定是否追问。
          - skills: [pet-care]
          - thought: 宠物类型或照护目标尚不明确时，直接询问最相关的信息，不重复询问已回答的问题。
          - reply: 你养的是什么宠物？

  - name: pet-cancel
    steps:
      - user: 先不弄了
      - bot:
          - thought: 尊重用户取消，停止当前追问并简短回应，不继续强行收集宠物资料。
          - reply: 好的，需要时再来找我。
