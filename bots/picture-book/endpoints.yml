base_store:
  type: sql
  dialect: sqlite
  db: workspace/sessions.db

# 主模型只负责规划、对话和工具决策；图像由专用工具处理，无需 vision 配置。
llms:
  default:
    type: openai
    key: ""
    apibase: ""
    model: ""
  image-generate:
    type: openai  # Qwen 图片兼容接口使用 qwen
    key: ""
    apibase: ""
    model: ""
    size: 1536x1024
  image-understanding:
    type: openai
    key: ""
    apibase: ""
    model: ""

# 可选排版配置；模型统一在 llms 下配置。
