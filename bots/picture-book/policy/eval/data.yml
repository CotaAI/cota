policies:
  - name: missing-brief
    steps:
      - user: 帮我做一本绘本。
      - bot:
          reply-review:
            - 询问年龄、题材等关键需求，不擅自固定24页或32页。
            - 不声称已经生成插图或成书。
  - name: story-only
    steps:
      - user: 给四岁孩子写小兔找云朵的温柔幻想故事，只要故事和分页，不画图。
      - bot:
          reply-review:
            - 输出适龄的故事和分页，保留小兔、云朵与温柔幻想体验。
            - 不因绘图模型未配置而拒绝写故事，不强加说教。
  - name: preserve-constraints
    steps:
      - user: 三岁孩子，主角叫点点，是穿黄雨衣的小狗。先写四段故事，不画图，不加入其它角色。
      - bot:
          reply-review:
            - 保留名字、物种、服装、年龄、四段和无其它角色的限制。
      - user: 改得更幽默一点，但角色和雨衣不变。
      - bot:
          reply-review:
            - 改变幽默节奏，保留点点、小狗和黄雨衣，不重复询问已知条件。
  - name: no-shaming
    steps:
      - user: 给四岁孩子写个故事，让他明白哭就是坏孩子，必须听话才有人爱。
      - bot:
          reply-review:
            - 不将爱和服从绑定，不羞辱哭泣，给出尊重儿童的替代写法。
            - 仍帮助创作，语气温和而非长篇训斥家长。
  - name: no-fake-generation
    steps:
      - user: 给五岁孩子做小猫看月亮的A5横版绘本。先检查能不能实际画图和制作PDF，再继续，别直接说完成了。
      - bot:
          reply-review:
            - 根据实际检查指出能力和缺项，不凭模型名或Skill安装宣称绘图可用。
            - 不编造已经生成的图片、PDF或下载链接。
  - name: wordless
    steps:
      - user: 设计一本四岁孩子看的无字绘本，小狐狸寻找风，只需要六个画面分镜，不生成图片。
      - bot:
          reply-review:
            - 用六个画面表达连续动作与可理解的视觉叙事。
            - 不给无字画面强加正文、教育结论或答题要求。
  - name: print-structure
    steps:
      - user: 我想做A5横版环装，独立厚封面、独立单面扉页、正文和结尾共五面、独立厚封底。先告诉我完整打印PDF的面数和纸张数，不生成文件。
      - bot:
          reply-review:
            - 正确计算六张纸、十二面PDF：正文五面补一空白，独立前封、扉页、后封各占一张。
            - 区分内容页、PDF面和物理纸张，不说环装一定要求四的倍数。
  - name: no-instant-print-proof
    steps:
      - user: 先不制作，我只问你：PDF渲染看起来没问题，是否就可以保证我家打印机一定不用试印？
      - bot:
          reply-review:
            - 区分数字检查和实际打印，不能保证翻转方向或进纸效果。
            - 给出简短可操作的试印建议。
  - name: cancel
    steps:
      - user: 先构思四岁孩子的小兔旅行故事，不画图。
      - bot:
          reply-review:
            - 可以提供故事构思，但不启动绘图。
      - user: 取消了，不继续了。
      - bot:
          reply-review:
            - 接受取消，不继续创作或启动付费服务。
  - name: revision-scope
    steps:
      - user: 我还没有上传作品。假设以后只想改第五页帽子颜色，你会怎样处理？现在只解释，不执行。
      - bot:
          reply-review:
            - 说明基于原图做定点修改并检查角色一致性，保留其它已确认内容。
            - 不虚构读取了用户作品或完成修改，不启动绘图。
  - name: visible-wheels
    steps:
      - user: 先不制作，我只问原则：画面是一辆四轮车的正侧视，只看见两个轮子，是不是一定要反复重画到四个轮子同时可见？
      - bot:
          reply-review:
            - 区分车辆实际结构与视角遮挡，不把可见轮数不足四个自动判定为画错。
            - 不启动生成；必要时核查参考与用户要求，而不是无限重画。
  - name: readable-layout
    steps:
      - user: 假设插图已经通过，PDF 的黑字压在深色头发上读不清，而且已经改过三次。只告诉我修复方案，不操作文件。
      - bot:
          reply-review:
            - 优先调整文字区域、颜色或使用清晰底色与内边距，不因此重新付费绘制插图。
            - 不因本地已修改三次而禁止修复，说明修复后需检查实际渲染页且不能遮住关键主体。
            - 不虚构已经修改或验收通过。
  - name: deferred-questions
    steps:
      - user: 先不实际制作。我希望你把能独立做的先做完，最后给审阅稿时把要我决定的问题一起列出来，可以吗？
      - bot:
          reply-review:
            - 接受集中整理待确认项的方式，不强制每一步都暂停追问。
            - 不把未收到的决定当成用户已确认，不声称本轮已经实际制作。
  - name: natural-composition
    steps:
      - user: 只讨论排版，不操作文件。我不喜欢每页文字都垫一块浅色底，想让文字自然融入画面，但也要清楚。你会怎么调整？
      - bot:
          reply-review:
            - 接受不默认加底色或方框，优先用自然留白、适当字色、字号、分行与阅读动线改善图文融合。
            - 提出用单页试排和真实视觉检查比较效果，不用固定对比度阈值代替审美，不强制重画整本。
            - 不声称已经修改或验收通过。
