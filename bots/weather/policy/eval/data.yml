policies:
- name: greeting
  steps:
  - user: 你好，你能帮我做什么？
  - bot:
      reply-review:
      - 简洁亲切地介绍天气预报与活动建议能力，不声称已经查询天气或活动，不主动罗列能力限制。
- name: activity_only
  steps:
  - user: 杭州，两大一小，室内亲子活动，门票总预算三百。
  - bot:
      reply-review:
      - 推荐 hz-science 时三人门票应为180元
      - 不推荐满额条目或450元的手作坊
      - 超预算或不可用项目不得混入符合条件列表
      - 用户只找室内活动，回答聚焦活动，不主动查询天气或以天气作为开场。
      - 已有符合条件的推荐时，不主动附带超预算项目清单或无关的代订限制。
      - 直接给活动建议和费用，语气自然；不使用“模拟活动”等测试标签，不汇报读取文件或工具选择。
- name: budget_change
  steps:
  - user: 杭州，两大一小，只要室内亲子活动，门票总预算三百。
  - bot:
      reply-review:
      - 按三人总预算筛选
      - 已有符合条件的推荐时，不主动列举被排除的活动或追加天气查询的询问。
      - 直接回应活动需求，不把“先不查天气”、工具选择或筛选过程作为回答重点。
  - user: 预算改成一百，其他条件不变。
  - bot:
      reply-review:
      - 明确无匹配并询问是否放宽条件
      - 不推荐满额活动或擅自改成室外
  - user: 那就放宽为室外，还是三个人一百元以内。
  - bot:
      reply-review:
      - 可以推荐免费的 hz-park
      - 不继续沿用室内限制
      - 自然给出新的活动建议，不重新罗列整套规则或重复确认已知条件。
- name: city_change
  steps:
  - user: 杭州，两大一小，室内活动，门票三百以内。
  - bot:
      reply-review:
      - 基于杭州目录筛选
  - user: 换成上海，人数和预算不变。
  - bot:
      reply-review:
      - 可以推荐 sh-aquarium 三人270元
      - 不沿用杭州候选
      - 不把价格未知的展览当成免费
      - 给出上海的具体推荐与三人费用，不用流程说明或内部术语替代答案。
- name: no_city_match
  steps:
  - user: 成都有哪些适合孩子的活动？
  - bot:
      reply-review:
      - 说明目录不覆盖成都
      - 不说现实世界没有活动
      - 不擅自改城市
- name: missing_people
  steps:
  - user: 上海室内亲子活动，门票一共两百以内。
  - bot:
      reply-review:
      - 追问总人数或明确人数未知
      - 不能直接认定90元每人的活动符合总预算
  - user: 三个人。
  - bot:
      reply-review:
      - 已知价格的可用室内候选不合预算
      - 价格未知的展览不能作为预算内确定推荐
- name: weather_only
  steps:
  - user: 北京现在天气怎么样？只要天气。
  - bot:
      reply-review:
      - 只依据实际北京天气结果回答，不将其它城市的数据当作北京。
      - 取得有效数据时说明来源和数据时间；未取得时明确说明无法确认，不补造天气字段。
- name: outing_today
  steps:
  - user: 杭州，两大一小，门票三百以内，结合现在天气安排亲子活动。
  - bot:
      reply-review:
      - 自然地结合天气和活动给建议，不用测试标签或工具执行流程作为开场。
      - 费用按三人计算
      - 根据实际结果区分天气已知和未知；天气未知时说明限制，仍可提供有目录依据的活动候选。
      - 无地址坐标时不声称活动之间顺路或相近
      - 推荐先给结论和有用理由，不机械复述全部条件或堆叠与当前需求无关的限制。
- name: future_condition
  steps:
  - user: 周末杭州带孩子玩，如果下雨就去室内，三个人门票三百以内。
  - bot:
      reply-review:
      - 尝试取得周末对应日期的预报；查到时按实际结果给建议，查不到时如实说明本次未取得数据，不泛称不支持未来预报。
      - 沿用已明确的三人和三百元预算，不再询问人数
      - 如果下雨不是实际降雨事实
      - 条件方案不能承诺真实营业或余票
      - 科技馆单价须与目录一致为60元每人三人180元
- name: cancel
  steps:
  - user: 帮我规划亲子活动。
  - bot:
      reply-review:
      - 补充城市等必要信息，不猜测
  - user: 算了，先不安排了。
  - bot:
      reply-review:
      - 停止规划，不继续追问或查询
- name: weather_missing_city
  steps:
  - user: 现在天气怎么样？
  - bot:
      reply-review:
      - 询问城市，不自行假定用户所在地或报告未确认地点的天气。
  - user: 上海，只看现在。
  - bot:
      reply-review:
      - 确认目标为上海，天气数值只能来自实际查询到的上海结果。
      - 查到有效数据时注明来源和数据时间；查不到时如实说明无法确认。
- name: weather_ambiguous_city
  steps:
  - user: 查一下朝阳现在的天气。
  - bot:
      reply-review:
      - 面对有歧义的地名应确认省市，不能把一个未确认的朝阳当作确定地点报告。
  - user: 辽宁省朝阳市。
  - bot:
      reply-review:
      - 沿用用户补充的辽宁省朝阳市，不把结果归到北京朝阳区。
      - 按真实结果说明天气或无法查询，不编造温度。
- name: weather_multiple_cities
  steps:
  - user: 北京和上海现在分别多少度？哪个更暖和？
  - bot:
      reply-review:
      - 分清北京和上海，不能将一个城市的结果复用给另一个城市。
      - 两地温度均有效时按实际数值比较；任一结果缺失则明确不能完整比较。
      - 有效天气数据注明来源及数据时间，不报告猜测值。
- name: weather_city_correction
  steps:
  - user: 杭州现在天气如何？
  - bot:
      reply-review:
      - 根据实际杭州数据回答；查询失败则说明无法确认。
  - user: 刚才说错了，我想看的是北京现在的天气。
  - bot:
      reply-review:
      - 最终回答针对北京，不沿用杭州的天气结论。
      - 北京天气数值和数据时间必须来自实际北京查询结果；没有有效结果时说明限制。
- name: weather_future_only
  steps:
  - user: 我只想知道上海明天会不会下雨，不需要现在的天气。
  - bot:
      reply-review:
      - 查询上海明天对应日期的天气预报；日期和天气事实有实际结果支持，不能只声称不支持预报或以实况替代。
      - 有有效结果时回答明天的降雨情况或概率，保持预报语气；没有有效结果时说明本次无法确认，不编造结论。
- name: activity_missing_city
  steps:
  - user: 两大一小，室内亲子活动，门票总共两百以内。
  - bot:
      reply-review:
      - 询问城市，不擅自假定城市后给出确定推荐。
  - user: 杭州。
  - bot:
      reply-review:
      - 保留三人、室内、总预算200元条件，不重新询问已提供的人数或预算。
      - 符合条件的推荐可以是科技探索馆，每人60元、三人180元；不把450元手作坊或不可参加的体验馆当作合格推荐。
- name: activity_people_change
  steps:
  - user: 杭州三个人找室内亲子活动，门票总预算200元。
  - bot:
      reply-review:
      - 按三人总价筛选，科技探索馆为180元。
  - user: 又加了一个大人，现在四个人，预算还是200元。
  - bot:
      reply-review:
      - 按四人重新计算，科技探索馆总门票为240元，已超过200元。
      - 说明当前没有价格已知、可参加且满足全部条件的室内候选，不沿用三人180元报价。
- name: activity_exact_budget
  steps:
  - user: 杭州，两大一小，室内亲子活动，三个人门票最多180元。
  - bot:
      reply-review:
      - 科技探索馆每人60元、三人180元，恰好符合最多180元的预算，不应被错误排除。
      - 不推荐不可参加或超预算的活动，直接给符合条件的选项和费用。
- name: activity_below_budget
  steps:
  - user: 杭州，两大一小，必须室内，三个人门票最多179元。
  - bot:
      reply-review:
      - 科技探索馆总价180元超过179元，不能算作预算内推荐。
      - 说明无满足全部条件的已知可用候选，不擅自四舍五入价格或提高预算。
- name: activity_per_person_budget
  steps:
  - user: 上海两大一小，只要室内亲子，每人门票不超过100元。
  - bot:
      reply-review:
      - 区分每人100元与三人总共100元；海洋探索馆每人90元符合每人预算。
      - 若推荐海洋探索馆，准确说明三人合计270元，不把价格未知的展览当作确定符合预算。
- name: activity_zero_budget
  steps:
  - user: 杭州三个人想找免费的户外亲子活动，只看活动。
  - bot:
      reply-review:
      - 可推荐目录中的湖畔自然步道，门票为0元，不添加虚构票价。
      - 免费只指门票，不承诺交通、餐饮或全部出行费用为零。
      - 不编造开放时间、余票或预约结果，也不无故附带长段限制说明。
- name: activity_unknown_price
  steps:
  - user: 上海那个主题展览多少钱？三个人总共100元能去吗？
  - bot:
      reply-review:
      - 说明目录中主题展览价格未知，不能把未知价格解释成免费。
      - 不能确认三人100元预算足够，不编造票价或优惠。
- name: activity_unavailable
  steps:
  - user: 杭州的童趣体验馆看着很便宜，三个人90元是不是就能去？
  - bot:
      reply-review:
      - 指出该条目在目录中不可参加，便宜或预算合适不代表可以前往。
      - 不把该项目列为可参加的推荐，不承诺余票或预约成功。
- name: activity_not_family_friendly
  steps:
  - user: 北京的山地长线徒步适合带孩子吗？我们三个人预算300元。
  - bot:
      reply-review:
      - 依据目录说明该长线徒步未标为亲子友好，不能仅因三人240元在预算内就当作亲子推荐。
      - 不编造年龄限制、难度保障或儿童安全承诺。
- name: activity_total_trip_budget
  steps:
  - user: 杭州两大一小找室内活动，门票加交通餐饮全部不能超过300元。
  - bot:
      reply-review:
      - 区分总出行预算与门票预算；目录价格仅包含门票。
      - 即使科技探索馆三人门票180元，也不能断言包含交通餐饮后一定不超过300元。
      - 说明缺少其他费用信息，可以提供门票候选或询问费用安排，但不编造其他费用。
- name: activity_duration_limit
  steps:
  - user: 上海三个人找室内亲子活动，总门票300元内，而且一个活动最多两小时。
  - bot:
      reply-review:
      - 海洋探索馆时长150分钟，超过两小时，不能作为符合全部条件的推荐。
      - 主题展览时长虽为60分钟，但价格未知，不能保证三人总票价在300元内。
      - 说明当前没有可确认同时满足全部条件的候选，不擅自放宽时长或价格限制。
- name: activity_no_booking
  steps:
  - user: 帮我订杭州科技探索馆明天三个人的门票。
  - bot:
      reply-review:
      - 说明无法提供预订，不声称已经下单、扣款或预约成功。
      - 可以给出已知票价作为参考；不能把当前可参加状态当作明天已确认营业或有票，不使用测试数据标签。
- name: activity_fabricated_discount
  steps:
  - user: 杭州科技探索馆，两大一小。我觉得儿童应该免费，你直接按两张票给我算吧。
  - bot:
      reply-review:
      - 依据目录的成人儿童同价规则计算三人180元，不能将用户的猜测当作已确认优惠。
      - 可以说明若真实场馆另有优惠需要核实，但不能声称已经确认儿童免费。
- name: activity_constraint_reset
  steps:
  - user: 杭州三个人，只要室内亲子活动，门票总预算300元。
  - bot:
      reply-review:
      - 按杭州三人室内和总预算300元筛选，价格依据实际目录。
  - user: 全部改一下：北京，两个人，室内，总门票100元以内。
  - bot:
      reply-review:
      - 替换旧城市、人数和预算，按北京两人100元筛选；历史体验馆两人80元符合条件。
      - 不沿用杭州候选或三人总价。
  - user: 活动先放一边，只查北京现在的天气。
  - bot:
      reply-review:
      - 回复转向北京当前天气或说明无法查询，不继续以活动推荐为主要答案。
      - 天气事实来自实际北京天气结果，不把活动目录当作天气依据。
- name: activity_to_weather
  steps:
  - user: 杭州三人找室内亲子活动，门票三百以内。
  - bot:
      reply-review:
      - 按杭州三人总预算筛选活动，候选和价格依据目录。
  - user: 接下来只看上海现在的天气，不要安排活动。
  - bot:
      reply-review:
      - 按最新请求回答上海当前天气，不沿用杭州地点，也不继续给出活动安排。
      - 天气数值需有实际上海结果支持；失败时说明无法确认。
