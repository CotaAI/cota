policies:
  - name: weather-selection
    steps:
      - user: 帮我查一下天气
      - bot:
          - thought: 用户需要天气信息，选择 weather Skill，按需阅读指引；多个城市分别查询，闲聊无需查询。
          - skills: [weather]
          - thought: 当前没有明确城市，直接询问城市，在用户回答后继续；用户取消则停止。
          - reply: 你想查询哪个城市的天气？
      - user: 北京
      - bot:
          - thought: 用户已经提供城市，继续使用 weather，不重复询问。
          - skills: [weather]
          - thought: 使用 web_fetch 查询并校验地点与目标日期。主来源失败时按 Skill 尝试备用来源；先回答天气问题，再简短注明来源与数据时间，不能照抄案例或猜测。

  - name: weather-city
    steps:
      - user: 查一下朝阳的天气
      - bot:
          - thought: 地名可能存在歧义，使用 weather 指引明确查询地点。
          - skills: [weather]
          - thought: 地点仍不明确时直接追问，不自行假定省市。
          - reply: 你指的是哪个城市或地区的朝阳？

  - name: weather-success
    steps:
      - user: 北京现在多少度？
      - bot:
          - skills: [weather]
          - result: 查询成功，地点确认为北京，返回气温 22°C，来源 wttr.in，观测时间 09:00 AM。
          - thought: 依据真实返回值说明温度、来源和观测时间，案例数值不能用于实际回复。
          - reply: 北京现在 22°C。数据来自 wttr.in，当地时间上午 9 点。

  - name: weather-unavailable
    steps:
      - user: 帮我查北京现在的天气
      - bot:
          - skills: [weather]
          - result: 主服务与备用服务均无法提供有效天气数据，当前天气无法确认。
          - thought: 服务不可用不代表城市不存在；说明暂时无法查询，不猜测或无限重试。
          - reply: 暂时没查到北京的天气，稍后再试一下吧。

  - name: weather-invalid-data
    steps:
      - user: 帮我查北京现在的天气
      - bot:
          - skills: [weather]
          - result: 主服务返回了内容，但不是有效天气 JSON，无法读取可信的天气信息。
          - thought: 按 weather 的 SOP 使用备用服务，仍须校验地点和数据。
          - skills: [weather]
          - thought: 根据备用服务的真实结果继续处理；仍无有效数据时明确告知。

  - name: weather-city-not-found
    steps:
      - user: 查一下星星城现在的天气
      - bot:
          - skills: [weather]
          - result: 主服务未返回目标城市的有效天气，备用地理编码服务正常返回，但没有匹配地点。
          - thought: 请用户补充城市信息，不把未匹配归因于服务故障，也不擅自换成其它城市。
          - reply: 暂时没有找到这个地点，你可以提供城市的完整名称或所在省份吗？

  - name: outing-selection
    steps:
      - user: 杭州，两大一小，门票总预算三百，今天想带孩子出去玩。
      - bot:
          - thought: 用户需要综合方案，结合实际天气和活动；总人数为三人，不能把预算当作每人预算。
          - skills: [outing-plan, weather, activity-search]
          - thought: 按实际天气和活动信息选出合适候选，再计算三人门票。直接给最合适的建议和关键理由，不向用户介绍 Skill 选择或筛选流程；仅在与当前决定有关时解释信息缺口。
          - result: 查到杭州天气为雨；可参加的室内科技探索馆每人60元、三人180元，活动约两小时。
          - thought: 以上只是示例结果，实际回答必须用本次查询到的事实。用推荐理由和费用帮助用户决定，不把所有备选和排除原因逐条列出。
          - reply: 今天有雨，带孩子去科技探索馆比较合适，可以在室内玩两小时。门票每人60元，你们三人共180元，在预算内。

  - name: outing-weather-unavailable
    steps:
      - user: 杭州三个人，门票三百以内，帮我安排出行。
      - bot:
          - skills: [weather]
          - result: 主来源和备用来源都未取得有效天气，无法确认当前天气。
          - thought: 天气未知不能说成下雨。活动查询可以独立继续，明确天气信息缺失，不承诺户外条件。
          - skills: [activity-search, outing-plan]
          - thought: 提供符合用户约束的候选；室内候选可以作为不确定天气下的选择，但不要声称它由降雨预报支持。

  - name: outing-budget
    steps:
      - user: 杭州三个人，只要室内亲子活动，门票总共不超过一百元。
      - bot:
          - skills: [activity-search]
          - result: 活动目录中符合其它条件且可用、价格已知的室内活动，三人最低门票为一百八十元，超出预算。
          - thought: 不推荐已满额条目，不擅自增加预算或换成室外。说明条件冲突，请用户决定是否提高预算或放宽室内条件。
          - reply: 室内亲子活动目前三人门票最低180元，超出预算80元。要不要考虑免费的湖畔自然步道？

  - name: outing-city-change
    steps:
      - user: 杭州，两大一小，室内亲子活动，门票预算三百。
      - bot:
          - thought: 用户在找室内活动，没有要求结合天气。活动信息足以回答，直接查询活动；不额外引入天气、预订或路线话题。
          - skills: [activity-search]
          - result: 符合当前全部条件的活动是科技探索馆，每人60元，三人180元，可参加，适合亲子，时长两小时。
          - thought: 只推荐符合条件的科技探索馆。无需展示被排除的项目和内部筛选过程，也无需强调“不查天气”或预订限制。示例票价仍需用本次读取结果核对。
          - reply: 推荐科技探索馆，适合带孩子在室内玩两小时。门票每人60元，你们三人共180元，在预算内。
      - user: 改成上海，人数和预算不变。
      - bot:
          - thought: 保留三人和三百元总门票预算，淘汰杭州候选及天气结论；读取目录中的上海条目，需要天气时重新查上海。
          - skills: [activity-search]
          - thought: 按上海条目的实际价格重新计算，不沿用杭州报价；价格未知不视为免费。
          - result: 符合当前全部条件的活动是海洋探索馆，每人90元，三人270元，可参加，适合亲子，时长两个半小时。
          - reply: 上海可以选海洋探索馆，也是室内亲子活动，大约能玩两个半小时。门票每人90元，你们三人共270元。

  - name: outing-no-match
    steps:
      - user: 帮我找成都的亲子活动。
      - bot:
          - skills: [activity-search]
          - result: 活动目录没有成都条目。
          - thought: 说明活动目录覆盖范围，不推断现实中没有活动，不编造或擅自换城市。
          - reply: 暂时没查到成都的亲子活动。你有心仪的场所吗？可以告诉我，我们一起看看怎么安排。

  - name: outing-conditional-weather
    steps:
      - user: 周末杭州带孩子玩，如果下雨就去室内，三个人门票不超过三百。
      - bot:
          - thought: 用户希望周末出游，先核对杭州周末日期及对应预报，再结合活动给方案。“如果下雨”是偏好条件，不是降雨事实。沿用三人和三百元预算。
          - skills: [weather, activity-search, outing-plan]
          - thought: 有预报时依据目标日结果推荐，查不到时仍可提供晴雨条件方案。先给推荐与理由，不汇报查询顺序；天气来源和日期简短注明，不编造活动营业或余票。
          - result: 本次未取得目标日期的有效预报；科技探索馆为室内亲子活动，三人门票180元，湖畔自然步道免费。
          - reply: 可以把科技探索馆作为雨天备选，三人门票180元；晴天想在户外走走，可以选免费的湖畔自然步道。周末天气暂时没查到，临近出发再确认一下会更稳妥。
