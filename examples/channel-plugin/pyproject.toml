[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cota-channel-example"
version = "0.1.0"
description = "Generic signed webhook and REST channel example for Cota"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cota>=2.0.0", "httpx>=0.27,<0.28", "sanic>=23.12,<24"]

[project.entry-points."cota.channels"]
example_im = "cota_channel_example:ExampleIMChannel"

[tool.hatch.build.targets.wheel]
packages = ["src/cota_channel_example"]
