[project]
name = "cota"
version = "2.0.0"
description = "Bot development and deployment platform with durable state and Pi Core execution"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MingGuangShao", email = "690714362@qq.com"},
]
requires-python = ">=3.12"
keywords = ["chatbot", "dialogue", "agent", "llm", "raas", "robot-as-service"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "loguru>=0.7,<1.0",
    "openai>=1.31.1",
    "sanic>=23.12,<24.0",
    "sanic-routing>=23.12.0",
    "websockets>=11.0,<12.0",
    "aiohttp>=3.9,<4.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "sqlalchemy>=2.0.22,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "mcp>=1.0.0,<2.0.0",
    "croniter>=1.3.0",
]

[project.optional-dependencies]
feishu = ["lark-oapi==1.6.7"]
dev = [
    "pytest>=7.3.1,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
cota = "cota.__main__:main"

[project.urls]
Homepage = "https://github.com/CotaAI/cota"
Repository = "https://github.com/CotaAI/cota"
Documentation = "https://cotaai.github.io/cota/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cota"]

[tool.hatch.build]
exclude = [
    "**/.DS_Store", "**/node_modules/**", "**/*.test.mjs", ".build", "cota/runtime/_vendor", ".omc", ".venv",
    "bots/**/workspace/**", "bots/**/.venv/**", "bots/**/__pycache__/**",
    "bots/**/*.db", "bots/**/*.db-*", "bots/**/*.sqlite*", "bots/**/*.log",
    "bots/**/.env*", "bots/**/.front_cache.html", "bots/**/.front_meta.json",
    "bots/**/scheduler_jobs.json",
    "bots/**/.cota/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/cota", "/bots", "/scripts", "/hatch_build.py", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"cota/runtime/pi/worker.test.mjs" = "cota/runtime/pi/worker.test.mjs"
"cota/runtime/pi/http.test.mjs" = "cota/runtime/pi/http.test.mjs"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "asyncio: mark test as async",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".build", ".omc", "cota/runtime/_vendor", "bots/**/workspace"]

[tool.ruff.lint]
select = ["F", "E9"]

[[tool.uv.index]]
url = "http://mirrors.aliyun.com/pypi/simple"
